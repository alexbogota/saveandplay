name: Check sources

# Started by hand: GitHub -> Actions -> "Check sources" -> Run workflow.
# It opens every feed from data/sources.json and shows a table on the run page (scroll down to "Summary").
# The same table is also saved as a downloadable file ("sources-report" at the bottom of the run page).
# Nothing is published and the site is not touched.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the feeds
        run: node scripts/check-sources.mjs

      - name: Keep the report for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sources-report
          path: drafts/sources-report.*
          if-no-files-found: ignore
