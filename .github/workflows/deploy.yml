name: Deploy to hosting

# Runs on every push to main, and can also be started by hand
# (GitHub -> Actions -> "Deploy to hosting" -> Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, so two uploads never overlap.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the site into dist/
        run: npm run build

      - name: Upload dist/ to the hosting over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          # Folder on the server. Default is public_html/. To change it without editing code:
          # GitHub -> Settings -> Secrets and variables -> Actions -> Variables -> FTP_SERVER_DIR
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
