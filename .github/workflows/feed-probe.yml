name: Feed probe

# Started by hand: GitHub -> Actions -> "Feed probe" -> Run workflow.
# It downloads the Admitad product feeds listed in data/feeds.json and shows a report (columns, prices, samples)
# on the run page (Summary) and as a downloadable file ("feed-report" at the bottom of the run page).
# Nothing is published and the site is not touched. The access key comes from GitHub Secrets
# (ADMITAD_FEED_USER, ADMITAD_FEED_CODE) and is never printed.
on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Store key from data/feeds.json (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look at the feeds
        env:
          ADMITAD_FEED_USER: ${{ secrets.ADMITAD_FEED_USER }}
          ADMITAD_FEED_CODE: ${{ secrets.ADMITAD_FEED_CODE }}
          STORE: ${{ inputs.store }}
        run: node scripts/feed-probe.mjs "$STORE"

      - name: Keep the report for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-report
          path: drafts/feed-report.md
          if-no-files-found: ignore
