name: Post to Nostr

# Every day at 06:30 Bogota time (half an hour after the "Daily brief"), and by hand:
# GitHub -> Actions -> "Post to Nostr" -> Run workflow, then choose a mode:
#   dry-run  (default) shows the note that would be posted, publishes nothing
#   post     posts today's note (only if "autopost" is true for the account in data/nostr-accounts.json; one note a day, a repeat is skipped)
#   profile  publishes or updates the Nostr profile (name, about, pictures, NIP-05 address)
#   check    checks the NIP-05 address on the live site and the relays in data/nostr-relays.json
# The scheduled run always means "post". Result: the run page, section "Summary" (text, npub, relays, note id).
# Green with "Skipped" = nothing to post or already posted today. Red = no relay accepted the note (or fewer than needed), or something is broken.
#
# The private key is the GitHub Secret NOSTR_NSEC (npm run nostr:secret sets it). It is passed only to the step that signs and is never printed.
on:
  schedule:
    - cron: '30 11 * * *' # 11:30 UTC = 06:30 Bogota, after the daily brief (11:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        default: dry-run
        options:
          - dry-run
          - post
          - profile
          - check

# Writing is needed only to save the record of posts on the "brief" branch.
permissions:
  contents: write

concurrency:
  group: nostr-post
  cancel-in-progress: false

jobs:
  nostr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event.inputs.mode || 'post' }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          # Always the newest main, so "Re-run jobs" on an old run does not use old code.
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Get the brief and the record of earlier posts
        if: ${{ env.MODE == 'post' || env.MODE == 'dry-run' }}
        run: bash scripts/nostr-branch.sh load

      - name: Run (${{ env.MODE }})
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: |
          case "$MODE" in
            post) node scripts/post-nostr.mjs ;;
            dry-run) node scripts/post-nostr.mjs --dry-run ;;
            profile) node scripts/nostr-profile.mjs ;;
            check) node scripts/nostr-check.mjs ;;
            *) echo "Unknown mode: $MODE"; exit 2 ;;
          esac

      # Read only: one line in Summary if a guide of the site has no Nostr draft yet (npm run nostr:articles adds them on the computer). Writes and commits nothing.
      - name: Guides without a Nostr draft
        if: ${{ always() && env.MODE == 'dry-run' }}
        run: node scripts/nostr-sync-articles.mjs --check

      # Runs even if the step above went red: a note that reached some relays must still be recorded, so it is not posted twice.
      - name: Save the record of posts on the brief branch
        if: ${{ always() && env.MODE == 'post' }}
        run: bash scripts/nostr-branch.sh save
