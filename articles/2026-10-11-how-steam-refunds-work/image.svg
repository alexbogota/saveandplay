<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#0D1117"/>
<rect x="56" y="22" width="1088" height="586" rx="28" fill="#161B22" stroke="#262D38"/>
<g font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<text x="100" y="110" font-size="40" font-weight="800" fill="#FFFFFF">How Steam refunds work</text>
<text x="100" y="156" font-size="28" fill="#9AA5B4">The rule on Steam's own refund page</text>
<rect x="100" y="200" width="440" height="190" rx="18" fill="none" stroke="#3DDC97" stroke-width="4"/>
<text x="320" y="290" font-size="64" font-weight="800" text-anchor="middle" fill="#FFFFFF">14 days</text>
<text x="320" y="345" font-size="30" text-anchor="middle" fill="#E8ECF1">since purchase</text>
<text x="600" y="315" font-size="64" font-weight="800" text-anchor="middle" fill="#E8ECF1">+</text>
<rect x="660" y="200" width="440" height="190" rx="18" fill="none" stroke="#3DDC97" stroke-width="4"/>
<text x="880" y="290" font-size="64" font-weight="800" text-anchor="middle" fill="#FFFFFF">&lt; 2 hours</text>
<text x="880" y="345" font-size="30" text-anchor="middle" fill="#E8ECF1">of playtime</text>
