<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#0D1117"/>
<rect x="56" y="22" width="1088" height="586" rx="28" fill="#161B22" stroke="#262D38"/>
<text x="100" y="105" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">How often can a Steam game</text>
<text x="100" y="162" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">go on sale?</text>
<rect x="100" y="215" width="300" height="200" rx="16" fill="none" stroke="#3DDC97" stroke-width="4"/>
<text x="250" y="270" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#9AA5B4">Depth</text>
<text x="250" y="345" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">10%-95%</text>
<rect x="450" y="215" width="300" height="200" rx="16" fill="none" stroke="#3DDC97" stroke-width="4"/>
<text x="600" y="270" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#9AA5B4">Length</text>
<text x="600" y="345" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">1-14 days</text>
<rect x="800" y="215" width="300" height="200" rx="16" fill="#FFB454"/>
<text x="950" y="270" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#1B1203">Gap between sales</text>
<text x="950" y="345" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="42" font-weight="700" fill="#1B1203">30 days</text>
<text x="600" y="490" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#E8ECF1">Also 30 days after release and after a price rise</text>
<text x="600" y="555" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#9AA5B4">Source: Steamworks documentation</text>
</svg>
