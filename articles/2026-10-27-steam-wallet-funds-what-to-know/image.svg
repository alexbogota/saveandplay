<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#0D1117"/>
<rect x="56" y="22" width="1088" height="586" rx="28" fill="#161B22" stroke="#262D38" stroke-width="2"/>
<g font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<text x="100" y="105" font-size="48" font-weight="800" fill="#FFFFFF">Steam Wallet funds: 4 rules</text>
<text x="100" y="148" font-size="28" fill="#9AA5B4">From Valve's own pages</text>
<rect x="100" y="185" width="480" height="170" rx="16" fill="none" stroke="#3DDC97" stroke-width="4"/>
<rect x="120" y="205" width="150" height="48" rx="10" fill="#FFB454"/>
<text x="195" y="240" font-size="30" font-weight="800" text-anchor="middle" fill="#1B1203">14 days</text>
<text x="120" y="293" font-size="30" fill="#E8ECF1">Refund a top-up</text>
<text x="120" y="332" font-size="30" fill="#E8ECF1">only if unspent</text>
<rect x="620" y="185" width="480" height="170" rx="16" fill="none" stroke="#3DDC97" stroke-width="4"/>
<rect x="640" y="205" width="150" height="48" rx="10" fill="#FFB454"/>
<text x="715" y="240" font-size="30" font-weight="800" text-anchor="middle" fill="#1B1203">$0 cash</text>
<text x="640" y="293" font-size="30" fill="#E8ECF1">No cash value,</text>
<text x="640" y="332" font-size="30" fill="#E8ECF1">no cash-out</text>
<rect x="100" y="385" width="480" height="170" rx="16" fill="none" stroke="#3DDC97" stroke-width="4"/>
<rect x="120" y="405" width="150" height="48" rx="10" fill="#FFB454"/>
<text x="195" y="440" font-size="30" font-weight="800" text-anchor="middle" fill="#1B1203">1 account</text>
<text x="120" y="493" font-size="30" fill="#E8ECF1">Not transferable</text>
<text x="120" y="532" font-size="30" fill="#E8ECF1">to anyone else</text>
<rect x="620" y="385" width="480" height="170" rx="16" fill="none" stroke="#3DDC97" stroke-width="4"/>
<rect x="640" y="405" width="190" height="48" rx="10" fill="#FFB454"/>
<text x="735" y="440" font-size="30" font-weight="800" text-anchor="middle" fill="#1B1203">US$2,000</text>
<text x="640" y="493" font-size="30" fill="#E8ECF1">Limit per 24 hours</text>
<text x="640" y="532" font-size="30" fill="#E8ECF1">(balance + spending)</text>
</g>
</svg>
