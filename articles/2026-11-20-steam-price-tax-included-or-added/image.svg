<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#0D1117"/>
<rect x="56" y="22" width="1088" height="586" rx="28" fill="#161B22" stroke="#262D38"/>
<text x="100" y="110" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">Steam: price vs. checkout total</text>
<rect x="100" y="160" width="460" height="250" rx="18" fill="none" stroke="#3DDC97" stroke-width="4"/>
<text x="130" y="215" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">VAT countries</text>
<text x="130" y="275" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#E8ECF1">Tax is inside the price</text>
<text x="130" y="340" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#E8ECF1">Total = shelf price</text>
<rect x="640" y="160" width="460" height="250" rx="18" fill="none" stroke="#3DDC97" stroke-width="4"/>
<text x="670" y="215" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">US and Canada</text>
<text x="670" y="275" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#E8ECF1">Sales tax added at checkout</text>
<text x="670" y="340" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#E8ECF1">Total = price + tax</text>
<rect x="100" y="450" width="760" height="64" rx="14" fill="#FFB454"/>
<text x="130" y="494" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#1B1203">Compare totals, not shelf prices</text>
<text x="100" y="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#9AA5B4">Source: Valve's Steam tax FAQ. saveandplay.com</text>
</svg>
