<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#0D1117"/>
<rect x="56" y="22" width="1088" height="586" rx="28" fill="#161B22" stroke="#262D38"/>
<text x="100" y="120" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">How to read Steam reviews</text>
<text x="100" y="175" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#9AA5B4">Two scores. Not every review counts.</text>
<rect x="100" y="230" width="440" height="110" rx="16" fill="#0D1117" stroke="#3DDC97" stroke-width="4"/>
<text x="320" y="296" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="36" fill="#FFFFFF">Past 30 days</text>
<rect x="100" y="380" width="440" height="110" rx="16" fill="#0D1117" stroke="#3DDC97" stroke-width="4"/>
<text x="320" y="446" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="36" fill="#FFFFFF">Lifetime</text>
<rect x="640" y="230" width="460" height="110" rx="16" fill="#0D1117" stroke="#3DDC97" stroke-width="4"/>
<text x="870" y="296" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#E8ECF1">Steam purchases count</text>
<rect x="640" y="380" width="460" height="110" rx="16" fill="#FFB454"/>
<text x="870" y="446" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#1B1203">Key activations do not</text>
<text x="100" y="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#9AA5B4">No real scores shown. Source: Steamworks documentation.</text>
</svg>
