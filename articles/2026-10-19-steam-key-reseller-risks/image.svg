<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#0D1117"/>
<rect x="56" y="22" width="1088" height="586" rx="28" fill="#161B22" stroke="#262D38"/>
<text x="100" y="100" font-size="44" font-weight="800" fill="#FFFFFF" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">Steam key from a reseller</text>
<text x="100" y="150" font-size="30" fill="#9AA5B4" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">Who answers if the key fails?</text>
<rect x="100" y="200" width="460" height="260" rx="18" fill="none" stroke="#3DDC97" stroke-width="4"/>
<text x="130" y="255" font-size="32" font-weight="800" fill="#FFFFFF" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">Bought on Steam</text>
<text x="130" y="310" font-size="28" fill="#E8ECF1" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">Refund offer:</text>
<text x="130" y="355" font-size="28" fill="#E8ECF1" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">within two weeks,</text>
<text x="130" y="400" font-size="28" fill="#E8ECF1" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">under two hours played</text>
<rect x="640" y="200" width="460" height="260" rx="18" fill="#FFB454"/>
<text x="670" y="255" font-size="32" font-weight="800" fill="#1B1203" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">Bought elsewhere</text>
<text x="670" y="310" font-size="28" fill="#1B1203" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">Valve cannot refund</text>
<text x="670" y="355" font-size="28" fill="#1B1203" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">purchases made outside</text>
<text x="670" y="400" font-size="28" fill="#1B1203" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">of Steam. Ask the seller.</text>
<text x="100" y="530" font-size="28" fill="#9AA5B4" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">Source: Steam refunds page, read October 19, 2026</text>
<text x="100" y="575" font-size="26" fill="#3DDC97" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">saveandplay.com</text>
</svg>
